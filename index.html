<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1b1a19">
  <meta name="description" content="Browse student-made exam paper analyses for SRM, by subject, year, and exam type.">
  <title>SRM Exam Library · One Shot HTML</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #1b1a19;
      --surface: #232220;
      --hover: #2a2826;
      --pressed: #35312e;
      --line: #3b3834;
      --text: #f0ede8;
      --muted: #b8b2ab;
      --accent: #d59a80;
      --control: 2.75rem;
      --radius: 0.3125rem;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100svh;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 1rem/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    [hidden] { display: none !important; }
    h1, p { margin: 0; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .wrap { width: min(100% - 3rem, 49rem); margin-inline: auto; }

    .top { border-bottom: 1px solid var(--line); }
    .top-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      min-height: 3.5rem;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      min-height: var(--control);
      border-radius: var(--radius);
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .brand-mark { color: var(--muted); font: 500 0.75rem var(--mono); }
    .top-actions { display: flex; align-items: center; gap: 0.125rem; margin-right: -0.625rem; }
    .quiet-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.375rem;
      min-height: var(--control);
      padding-inline: 0.625rem;
      border: 0;
      border-radius: var(--radius);
      background: transparent;
      color: var(--muted);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1;
      white-space: nowrap;
    }
    .quiet-button:focus-visible { outline-offset: 1px; }
    .quiet-button:hover { background-color: var(--hover); color: var(--text); }
    .quiet-button:active { background-color: var(--pressed); }
    .nav-icon { flex: none; width: 0.95rem; height: 0.95rem; }

    main { padding-block: clamp(1.25rem, 6svh, 3.25rem) 1rem; }
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(0.5rem, 3vw, 1.5rem);
      margin-bottom: 1rem;
    }
    .hero h1 {
      font: 400 clamp(2.5rem, 5vw, 3.625rem)/1.02 Georgia, "Times New Roman", serif;
      letter-spacing: -0.052em;
      text-wrap: balance;
    }
    .title-accent { color: var(--accent); }
    .art {
      display: block;
      width: clamp(8.5rem, 27vw, 14.25rem);
      height: auto;
      filter: grayscale(1) invert(1) contrast(1.48);
      mix-blend-mode: screen;
      opacity: 0.76;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.375rem 0;
      border-block: 1px solid var(--line);
    }
    .search {
      display: flex;
      flex: 0 1 13.5rem;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
      min-height: var(--control);
      margin-right: auto;
      padding-inline: 0.625rem;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .search:focus-within { border-color: var(--accent); }
    .search input {
      width: 100%;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 0.875rem;
      line-height: 2.5;
    }
    .search input::placeholder { color: var(--muted); }
    .magnifier {
      position: relative;
      flex: 0 0 0.6875rem;
      height: 0.6875rem;
      margin-right: 0.125rem;
      border: 1.5px solid var(--muted);
      border-radius: 50%;
    }
    .magnifier::after {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      width: 0.3125rem;
      height: 1.5px;
      transform: rotate(45deg);
      transform-origin: left;
      background: var(--muted);
      content: "";
    }
    .type-filter { display: flex; gap: 0.125rem; }
    .type-filter .quiet-button { position: relative; min-width: var(--control); }
    .type-filter button[aria-pressed="true"] { color: var(--text); font-weight: 650; }
    .type-filter button[aria-pressed="true"]::after {
      position: absolute;
      right: 0.625rem;
      bottom: 0.28rem;
      left: 0.625rem;
      height: 2px;
      border-radius: 1px;
      background: var(--accent);
      content: "";
    }
    .year-control { min-width: 5.75rem; }
    .year-control option { background: var(--surface); color: var(--text); }

    .results { margin: 0; padding: 0; list-style: none; }
    .analysis {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 0.75rem;
      min-height: 4.5rem;
      padding-block: 0.375rem;
      border-bottom: 1px solid var(--line);
    }
    .file-link {
      display: flex;
      justify-self: start;
      align-items: center;
      gap: 0.5rem;
      max-width: 100%;
      min-height: var(--control);
      padding: 0.25rem 0.5rem 0.25rem 0;
      border-radius: var(--radius);
    }
    .file-link:hover { background-color: var(--hover); }
    .file-link:active { background-color: var(--pressed); }
    .file-icon { display: block; flex: none; }
    .file-sheet { fill: var(--surface); stroke: #837b74; stroke-width: 1.3; }
    .file-fold { fill: var(--accent); }
    .file-code { fill: none; stroke: var(--muted); stroke-width: 1.35; stroke-linecap: round; stroke-linejoin: round; }
    .file-link:hover .file-code { stroke: var(--text); }
    .file-details { min-width: 0; }
    .file-name { display: block; font-size: 0.9375rem; font-weight: 600; line-height: 1.3; }
    .file-link:hover .file-name { text-decoration: underline; text-underline-offset: 0.2em; }
    .code, .exam { color: var(--muted); font: 0.75rem/1.4 var(--mono); }
    .code { display: block; margin-top: 0.18rem; }
    .exam { white-space: nowrap; }
    .empty {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      min-height: 4.5rem;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.875rem;
    }
    .clear { text-decoration: underline; text-underline-offset: 0.2em; }
    noscript a { text-decoration: underline; }

    @media (max-width: 37.5rem) {
      .wrap { width: calc(100% - 2rem); }
      main { padding-top: 1.375rem; }
      .hero { margin-bottom: 0.875rem; }
      .hero h1 { font-size: clamp(1.95rem, 7.5vw, 3rem); text-wrap: initial; }
      .art { width: min(35vw, 10.5rem); }
      .controls { gap: 0.25rem; }
      .search { flex: 1 1 7rem; max-width: 13.5rem; }
      .search input { font-size: 1rem; }
      .type-filter { gap: 0; }
      .type-filter .quiet-button { padding-inline: 0.375rem; }
      .year-control { min-width: 5.25rem; padding-inline: 0.25rem; }
    }
    @media (max-width: 21rem) {
      .wrap { width: calc(100% - 1.5rem); }
      .top-actions .quiet-button { padding-inline: 0.5rem; font-size: 0.8125rem; }
      .controls { flex-wrap: wrap; }
      .search { flex-basis: 100%; max-width: 100%; }
      .year-control { margin-left: auto; }
      .file-name { font-size: 0.875rem; }
      .exam { font-size: 0.6875rem; }
    }
  </style>
</head>
<body id="top">
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#top" aria-label="One Shot HTML">One Shot <span class="brand-mark" aria-hidden="true">[.html]</span></a>
      <nav class="top-actions" aria-label="Project links">
        <a class="quiet-button" href="https://github.com/aryan-astra/one-shot-html" target="_blank" rel="noopener noreferrer" aria-label="Star on GitHub">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="m8 1.8 1.88 3.8 4.2.61-3.04 2.97.72 4.18L8 11.39l-3.76 1.97.72-4.18-3.04-2.97 4.2-.61L8 1.8Z"/>
          </svg>
          Star
        </a>
        <a class="quiet-button" href="https://github.com/aryan-astra/one-shot-html#readme" target="_blank" rel="noopener noreferrer">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <circle cx="4" cy="4" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/>
            <path d="M4 5.5v5m8 0V7a3 3 0 0 0-3-3H8m2-2L8 4l2 2"/>
          </svg>
          Contribute
        </a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" aria-labelledby="page-title">
      <h1 id="page-title">SRM Exam <span class="title-accent">Library</span></h1>
      <img class="art" src="assets/readme-html-foldout.png" width="1536" height="1024" alt="Two students exploring questions inside one HTML file">
    </section>

    <section class="library" aria-label="Exam analyses">
      <p class="sr-only" id="count" role="status"></p>
      <div class="controls" id="controls" hidden>
        <div class="search">
          <span class="magnifier" aria-hidden="true"></span>
          <input id="query" type="search" placeholder="Search" aria-label="Search by subject or course code" autocomplete="off">
        </div>
        <div class="type-filter" id="type-filter" role="group" aria-label="Exam type">
          <button class="quiet-button" type="button" data-exam="" aria-pressed="true">All</button>
          <button class="quiet-button" type="button" data-exam="SEM" aria-pressed="false">SEM</button>
          <button class="quiet-button" type="button" data-exam="CT" aria-pressed="false">CT</button>
        </div>
        <select class="quiet-button year-control" id="year" aria-label="Exam year">
          <option value="">All years</option>
        </select>
      </div>

      <ul class="results" id="results" role="list"></ul>
      <div class="empty" id="empty" hidden>
        <p>No matching analyses.</p>
        <button class="quiet-button clear" id="clear" type="button">Clear filters</button>
      </div>
      <noscript><p><a href="sem-2026-21MAB302T-discrete-mathematics.html">Discrete Mathematics · SEM 2026</a></p></noscript>
    </section>
  </main>

  <template id="analysis-template">
    <li class="analysis">
      <a class="file-link" href="">
        <svg class="file-icon" width="36" height="42" viewBox="0 0 36 42" aria-hidden="true" focusable="false">
          <path class="file-sheet" d="M8 3h13l10 10v23a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z"/>
          <path class="file-fold" d="M21 3v8a2 2 0 0 0 2 2h8Z"/>
          <path class="file-code" d="m14 21-3 3 3 3m8-6 3 3-3 3m-2.6-8-2.8 10"/>
        </svg>
        <span class="file-details"><span class="file-name"></span><span class="code"></span></span>
      </a>
      <span class="exam"></span>
    </li>
  </template>

  <script type="application/json" id="catalog-files">
    ["sem-2026-21MAB302T-discrete-mathematics.html"]
  </script>
  <script>
    const files = JSON.parse(document.getElementById('catalog-files').textContent);
    const filenamePattern = /^(sem|ct)-(\d{4})-([a-z0-9]+)-([a-z0-9]+(?:-[a-z0-9]+)*)\.html$/i;
    const catalog = files.flatMap(filename => {
      const match = filenamePattern.exec(filename);
      if (!match) return [];

      const [, examType, year, courseCode, slug] = match;
      const title = slug.toLowerCase().replaceAll('-', ' ').replace(/\b[a-z]/g, letter => letter.toUpperCase());
      const exam = examType.toUpperCase();
      const code = courseCode.toUpperCase();
      const examName = exam === 'SEM' ? 'semester exam' : 'cycle test';
      const keywords = `${title} ${code} ${year} ${exam} ${examName}`.toLowerCase();
      return [{ filename, year, title, code, exam, keywords }];
    }).sort((a, b) => b.year.localeCompare(a.year) || a.title.localeCompare(b.title));

    const query = document.getElementById('query');
    const yearFilter = document.getElementById('year');
    const examButtons = Array.from(document.querySelectorAll('#type-filter button'));
    const results = document.getElementById('results');
    const count = document.getElementById('count');
    const empty = document.getElementById('empty');
    const rowTemplate = document.getElementById('analysis-template');
    let selectedExam = '';

    for (const year of new Set(catalog.map(entry => entry.year))) {
      yearFilter.add(new Option(year, year));
    }

    function render() {
      const terms = query.value.toLowerCase().match(/[a-z0-9]+/g) ?? [];
      const visible = catalog.filter(entry => (
        (!selectedExam || entry.exam === selectedExam) &&
        (!yearFilter.value || entry.year === yearFilter.value) &&
        terms.every(term => entry.keywords.includes(term))
      ));

      results.replaceChildren(...visible.map(entry => {
        const row = rowTemplate.content.cloneNode(true);
        const link = row.querySelector('a');
        link.href = entry.filename;
        row.querySelector('.file-name').textContent = entry.title;
        row.querySelector('.code').textContent = entry.code;
        row.querySelector('.exam').textContent = `${entry.exam} ${entry.year}`;
        return row;
      }));
      count.textContent = `${visible.length} ${visible.length === 1 ? 'analysis' : 'analyses'}`;
      empty.hidden = visible.length > 0;
    }

    function selectExam(exam) {
      selectedExam = exam;
      examButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.exam === exam)));
      render();
    }

    examButtons.forEach(button => button.addEventListener('click', () => selectExam(button.dataset.exam)));
    query.addEventListener('input', render);
    yearFilter.addEventListener('change', render);
    document.getElementById('clear').addEventListener('click', () => {
      query.value = '';
      yearFilter.value = '';
      selectExam('');
      query.focus();
    });
    render();
    document.getElementById('controls').hidden = false;
  </script>
</body>
</html>
